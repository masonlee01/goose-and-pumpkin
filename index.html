<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Goose and Pumpkin's Adventure</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;

        background: #241a2b;
